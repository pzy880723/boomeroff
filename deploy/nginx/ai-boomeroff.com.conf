server {
    if ($host = ai.boomeroff.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ai.boomeroff.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.boomeroff.com;
    ssl_certificate /etc/letsencrypt/live/ai.boomeroff.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.boomeroff.com/privkey.pem; # managed by Certbot
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/ai-boomeroff;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Route Supabase traffic through Tencent Cloud to avoid slow direct
    # connections from mainland networks. User data is never cached here.
    location ^~ /supabase/realtime/v1/ {
        proxy_pass https://narqwgwpqglathwtyevz.supabase.co/realtime/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_name narqwgwpqglathwtyevz.supabase.co;
        proxy_set_header Host narqwgwpqglathwtyevz.supabase.co;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /supabase/ {
        client_max_body_size 500m;
        proxy_pass https://narqwgwpqglathwtyevz.supabase.co/;
        proxy_ssl_server_name on;
        proxy_ssl_name narqwgwpqglathwtyevz.supabase.co;
        proxy_ssl_session_reuse on;
        proxy_set_header Host narqwgwpqglathwtyevz.supabase.co;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_redirect https://narqwgwpqglathwtyevz.supabase.co/ /supabase/;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fast Start 成片由腾讯云同源直出，避免 iOS WebView 跨境读取
    # Supabase 大文件时超时。Supabase Storage 仍保留长期备份和下载源。
    location ^~ /media/generated-videos/ {
        alias /var/www/aigc-cover/optimized-videos/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges "bytes" always;
        types {
            video/mp4 mp4;
        }
    }

    location /compose/ {
        alias /var/www/aigc-compose/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
        }
    }

}
