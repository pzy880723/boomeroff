server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.boomeroff.com;

    ssl_certificate /etc/letsencrypt/live/go.boomeroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.boomeroff.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/boomer-go-operations.conf;

    location / {
        return 404;
    }
}
